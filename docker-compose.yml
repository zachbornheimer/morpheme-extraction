version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: morpheme-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - ./neo4j-data:/data
      - ./neo4j-logs:/logs
      - ./semantic-graph.cypher:/import/semantic-graph.cypher
    networks:
      - morpheme-network

networks:
  morpheme-network:
    driver: bridge
